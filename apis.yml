name: Swimply
description: 'Swimply is a peer-to-peer marketplace that lets people book private
  swimming pools and other recreational spaces (family, party, and luxury pools plus
  tennis, pickleball, and basketball courts) by the hour, and lets owners list and
  monetize their spaces as hosts. Operating across the US, Canada, and Australia,
  the platform reports over 4 million five-star experiences, 15,000+ active hosts,
  and 15,000+ available spaces, and offers a 2026 Summer Pass membership. Backed by
  Norwest Venture Partners. No public API or developer program was found at the time
  of enrichment; this profile documents the company''s public web surface only.'
